<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Friction: Why Constraints Are the Secret Lubricant of AI-Assisted Shipping</title>
    <!-- Premium Font Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Syntax highlighting, no build step. index.css loads after, so it wins. -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js"></script>

    <link rel="stylesheet" href="index.css">
</head>

<body>
    <!-- Start overlay: removed when START is clicked -->
    <div id="start-overlay">
        <button id="start-btn" type="button" disabled>START</button>
        <p id="start-error"></p>
    </div>

    <!-- Slides are fetched from slides/ and injected here -->
    <div id="slides-container"></div>

    <script>
        const container = document.getElementById('slides-container');
        const overlay = document.getElementById('start-overlay');

        let slides = [];
        let current = 0;
        let step = 0; // how many [data-fade] blocks of the current slide are revealed

        // Blocks marked data-fade start hidden and appear one press at a time,
        // in document order. Anything unmarked is visible as soon as the slide is.
        const fades = (slide) => [...slide.querySelectorAll('[data-fade]')];

        function applySteps() {
            fades(slides[current]).forEach((el, i) => el.classList.toggle('revealed', i < step));
        }

        // CSS owns the transitions -- JS only moves the `active`/`revealed` classes.
        function show(index, revealAll = false) {
            if (index < 0 || index >= slides.length) return;
            slides[current].classList.remove('active');
            current = index;
            step = revealAll ? fades(slides[current]).length : 0;
            applySteps();
            slides[current].classList.add('active');
        }

        function next() {
            if (step < fades(slides[current]).length) {
                step += 1;
                applySteps();
            } else {
                show(current + 1);
            }
        }

        function previous() {
            if (step > 0) {
                step -= 1;
                applySteps();
            } else {
                // Stepping back into a slide shows it as you left it: fully revealed.
                show(current - 1, true);
            }
        }

        function start() {
            overlay.remove();
            show(0);
            // Fullscreen is a nice-to-have -- never let it block starting.
            document.documentElement.requestFullscreen?.().catch(() => { });
        }

        const startBtn = document.getElementById('start-btn');
        startBtn.addEventListener('click', start);

        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowRight') next();
            if (event.key === 'ArrowLeft') previous();
        });

        // Fetch every slide fragment in parallel, insert them in order.
        // `now` is a cache-buster so an edited slide is never served stale.
        const now = Date.now();

        fetch(`slides/slides.json?now=${now}`)
            .then((response) => response.json())
            .then((ids) => Promise.all(ids.map((id) => fetch(`slides/${id}.html?now=${now}`).then((r) => {
                if (!r.ok) throw new Error(`${id}.html -> HTTP ${r.status}`);
                return r.text();
            }))))
            .then((html) => {
                // Parse each fragment on its own, so an unclosed tag in one slide
                // can't swallow the slides that follow it.
                slides = html.map((fragment) => {
                    const template = document.createElement('template');
                    template.innerHTML = fragment;
                    return template.content.firstElementChild;
                });
                slides.forEach((slide) => container.append(slide));
                // Slides arrive after page load, so highlight them here.
                container.querySelectorAll('pre code').forEach((el) => window.hljs?.highlightElement(el));
                if (window.matchMedia('(max-width: 1024px)').matches) {
                    // Mobile/tablet: stack every slide, nothing staged, no navigation.
                    slides.forEach((slide) => {
                        slide.classList.add('active');
                        fades(slide).forEach((el) => el.classList.add('revealed'));
                    });
                    overlay.remove();
                } else {
                    startBtn.disabled = false; // greyed out until the slides are in
                }
            })
            .catch((error) => {
                document.getElementById('start-error').textContent =
                    `Could not load slides (${error.message}). Serve this folder over HTTP, `
                    + 'e.g. `npx serve slides` -- fetch() does not work on file:// URLs.';
                console.error(error);
            });
    </script>
</body>

</html>
